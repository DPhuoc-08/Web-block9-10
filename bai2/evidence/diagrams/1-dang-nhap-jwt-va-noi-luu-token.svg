<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1447" width="1100" height="1447" font-family="'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14">
<title>Đăng nhập JWT và nơi lưu token</title>
<rect width="1100" height="1447" fill="#f7f6f3"/>
<text x="40" y="50" font-size="24" font-weight="700" fill="#1d1d1b">Đăng nhập JWT và nơi lưu token</text>
<text x="40" y="78" fill="#5f5f5a">POST /api/auth/login → (POST /api/auth/mfa) → sessionStorage · web ở :5173, api ở :3000</text>
<text x="80" y="104" font-size="12" font-weight="700" fill="#1f5b43" letter-spacing=".04em">LUỒNG CHÍNH (thứ tự trong code)</text>
<text x="650" y="104" font-size="12" font-weight="700" fill="#a8281d" letter-spacing=".04em">DỪNG Ở ĐÂY — không làm các bước bên dưới</text>
<rect x="40" y="112" width="520" height="100" rx="10" fill="#eef0f3" stroke="#d9d6cf"/><text x="56" y="138" font-weight="700" fill="#1d1d1b">Trang đăng nhập của web gửi JSON</text><text x="56" y="157" fill="#5f5f5a">email, password, captchaToken (khi api yêu cầu)</text><text x="56" y="176" fill="#5f5f5a">Không gửi Authorization: chưa có token</text><text x="56" y="195" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">web/src/pages/auth/LoginPage.jsx:53</text><line x1="80" y1="212" x2="80" y2="246" stroke="#1f5b43" stroke-width="2"/><path d="M75 244 L80 252 L85 244Z" fill="#1f5b43"/><text x="90" y="236" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="252" width="520" height="62" rx="10" fill="#ffffff" stroke="#d9d6cf"/><rect x="40" y="252" width="5" height="62" rx="2" fill="#1f5b43"/><text x="56" y="278" font-weight="700" fill="#1d1d1b">Giới hạn theo IP, 30 lần / 15 phút</text><text x="56" y="297" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">api/src/routes/auth.js:64 · DB rate_limits</text><rect x="650" y="252" width="410" height="43" rx="10" fill="#fbecea" stroke="#efc2bd"/><text x="666" y="278" font-weight="700" fill="#a8281d">429 RATE_LIMITED + Retry-After</text><line x1="560" y1="278" x2="644" y2="278" stroke="#a8281d" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M642 273 L650 278 L642 283Z" fill="#a8281d"/><text x="605" y="271" font-size="12" text-anchor="middle" fill="#a8281d" font-weight="600">vượt</text><line x1="80" y1="314" x2="80" y2="348" stroke="#1f5b43" stroke-width="2"/><path d="M75 346 L80 354 L85 346Z" fill="#1f5b43"/><text x="90" y="338" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="354" width="520" height="62" rx="10" fill="#ffffff" stroke="#d9d6cf"/><rect x="40" y="354" width="5" height="62" rx="2" fill="#1f5b43"/><text x="56" y="380" font-weight="700" fill="#1d1d1b">Email đang khoá? (đủ 10 lần sai)</text><text x="56" y="399" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">api/src/routes/auth.js:70</text><rect x="650" y="354" width="410" height="43" rx="10" fill="#fbecea" stroke="#efc2bd"/><text x="666" y="380" font-weight="700" fill="#a8281d">429 dù password đúng</text><line x1="560" y1="380" x2="644" y2="380" stroke="#a8281d" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M642 375 L650 380 L642 385Z" fill="#a8281d"/><text x="605" y="373" font-size="12" text-anchor="middle" fill="#a8281d" font-weight="600">đang khoá</text><line x1="80" y1="416" x2="80" y2="450" stroke="#1f5b43" stroke-width="2"/><path d="M75 448 L80 456 L85 448Z" fill="#1f5b43"/><text x="90" y="440" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="456" width="520" height="81" rx="10" fill="#ffffff" stroke="#d9d6cf"/><rect x="40" y="456" width="5" height="81" rx="2" fill="#1f5b43"/><text x="56" y="482" font-weight="700" fill="#1d1d1b">Đã sai ≥ 3 lần: CAPTCHA trước khi so password</text><text x="56" y="501" fill="#5f5f5a">Bộ đếm ở DB, gọi API trực tiếp không đặt lại được</text><text x="56" y="520" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">api/src/routes/auth.js:73</text><rect x="650" y="456" width="410" height="62" rx="10" fill="#fbecea" stroke="#efc2bd"/><text x="666" y="482" font-weight="700" fill="#a8281d">200 CAPTCHA_REQUIRED / INVALID_CAPTCHA</text><text x="666" y="501" fill="#a8281d">Không so password, không có token.</text><line x1="560" y1="482" x2="644" y2="482" stroke="#a8281d" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M642 477 L650 482 L642 487Z" fill="#a8281d"/><text x="605" y="475" font-size="12" text-anchor="middle" fill="#a8281d" font-weight="600">thiếu / sai</text><line x1="80" y1="537" x2="80" y2="571" stroke="#1f5b43" stroke-width="2"/><path d="M75 569 L80 577 L85 569Z" fill="#1f5b43"/><text x="90" y="561" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="577" width="520" height="81" rx="10" fill="#ffffff" stroke="#d9d6cf"/><rect x="40" y="577" width="5" height="81" rx="2" fill="#1f5b43"/><text x="56" y="603" font-weight="700" fill="#1d1d1b">So password Argon2id</text><text x="56" y="622" fill="#5f5f5a">Email không có vẫn verify với hash giả</text><text x="56" y="641" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">api/src/routes/auth.js:77</text><rect x="650" y="577" width="410" height="62" rx="10" fill="#fbecea" stroke="#efc2bd"/><text x="666" y="603" font-weight="700" fill="#a8281d">200 INVALID_CREDENTIALS</text><text x="666" y="622" fill="#a8281d">Bộ đếm + 1; đủ 10 lần: 429.</text><line x1="560" y1="603" x2="644" y2="603" stroke="#a8281d" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M642 598 L650 603 L642 608Z" fill="#a8281d"/><text x="605" y="596" font-size="12" text-anchor="middle" fill="#a8281d" font-weight="600">sai</text><line x1="80" y1="658" x2="80" y2="692" stroke="#1f5b43" stroke-width="2"/><path d="M75 690 L80 698 L85 690Z" fill="#1f5b43"/><text x="90" y="682" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="698" width="520" height="62" rx="10" fill="#ffffff" stroke="#d9d6cf"/><rect x="40" y="698" width="5" height="62" rx="2" fill="#1f5b43"/><text x="56" y="724" font-weight="700" fill="#1d1d1b">Tài khoản active?</text><text x="56" y="743" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">api/src/routes/auth.js:83</text><rect x="650" y="698" width="410" height="62" rx="10" fill="#fbecea" stroke="#efc2bd"/><text x="666" y="724" font-weight="700" fill="#a8281d">200 ACCOUNT_NOT_ACTIVATED</text><text x="666" y="743" fill="#a8281d">Không có accessToken.</text><line x1="560" y1="724" x2="644" y2="724" stroke="#a8281d" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M642 719 L650 724 L642 729Z" fill="#a8281d"/><text x="605" y="717" font-size="12" text-anchor="middle" fill="#a8281d" font-weight="600">pending</text><line x1="80" y1="760" x2="80" y2="794" stroke="#1f5b43" stroke-width="2"/><path d="M75 792 L80 800 L85 792Z" fill="#1f5b43"/><text x="90" y="784" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="800" width="520" height="119" rx="10" fill="#ffffff" stroke="#d9d6cf"/><rect x="40" y="800" width="5" height="119" rx="2" fill="#1f5b43"/><text x="56" y="826" font-weight="700" fill="#1d1d1b">Đã bật MFA?</text><text x="56" y="845" fill="#5f5f5a">Có: trả next mfa + challenge, KHÔNG có accessToken</text><text x="56" y="864" fill="#5f5f5a">Challenge ngẫu nhiên, DB lưu hash, 5 phút, dùng một lần</text><text x="56" y="883" fill="#5f5f5a">Web giữ challenge trong bộ nhớ, không vào storage</text><text x="56" y="902" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">api/src/routes/auth.js:87 · DB mfa_challenges</text><rect x="650" y="800" width="410" height="100" rx="10" fill="#fdf3dc" stroke="#ecd9a8"/><text x="666" y="826" font-weight="700" fill="#8a5a00">Chỉ POST /api/auth/mfa nhận</text><text x="666" y="845" fill="#5f5f5a">Gửi tới route dữ liệu: 401 vì không phải JWT.</text><text x="666" y="864" fill="#5f5f5a">Access token gửi tới đây: 401.</text><text x="666" y="883" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">api/src/routes/auth.js:96</text><line x1="560" y1="826" x2="644" y2="826" stroke="#a8281d" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M642 821 L650 826 L642 831Z" fill="#a8281d"/><text x="605" y="819" font-size="12" text-anchor="middle" fill="#a8281d" font-weight="600">challenge</text><line x1="80" y1="919" x2="80" y2="953" stroke="#1f5b43" stroke-width="2"/><path d="M75 951 L80 959 L85 951Z" fill="#1f5b43"/><text x="90" y="943" font-size="12" fill="#1f5b43" font-weight="600">POST /api/auth/mfa (hoặc thẳng nếu chưa bật)</text><rect x="40" y="959" width="520" height="100" rx="10" fill="#ffffff" stroke="#d9d6cf"/><rect x="40" y="959" width="5" height="100" rx="2" fill="#1f5b43"/><text x="56" y="985" font-weight="700" fill="#1d1d1b">Mã đúng và chưa dùng; challenge dùng một lần</text><text x="56" y="1004" fill="#5f5f5a">TOTP ±1 bước, chặn dùng lại bằng câu ghi có điều kiện</text><text x="56" y="1023" fill="#5f5f5a">Sai 5 lần / 15 phút: 429 dù mã đúng</text><text x="56" y="1042" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">api/src/routes/auth.js:112</text><rect x="650" y="959" width="410" height="43" rx="10" fill="#fbecea" stroke="#efc2bd"/><text x="666" y="985" font-weight="700" fill="#a8281d">200 INVALID_OTP</text><line x1="560" y1="985" x2="644" y2="985" stroke="#a8281d" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M642 980 L650 985 L642 990Z" fill="#a8281d"/><text x="605" y="978" font-size="12" text-anchor="middle" fill="#a8281d" font-weight="600">sai</text><rect x="650" y="1012" width="410" height="43" rx="10" fill="#fbecea" stroke="#efc2bd"/><text x="666" y="1038" font-weight="700" fill="#a8281d">401, về đăng nhập</text><line x1="560" y1="1038" x2="644" y2="1038" stroke="#a8281d" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M642 1033 L650 1038 L642 1043Z" fill="#a8281d"/><text x="605" y="1031" font-size="12" text-anchor="middle" fill="#a8281d" font-weight="600">challenge hỏng</text><line x1="80" y1="1059" x2="80" y2="1093" stroke="#1f5b43" stroke-width="2"/><path d="M75 1091 L80 1099 L85 1091Z" fill="#1f5b43"/><text x="90" y="1083" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="1099" width="520" height="119" rx="10" fill="#e8f1ec" stroke="#b9d3c5"/><text x="56" y="1125" font-weight="700" fill="#1d1d1b">Ký access token HS256, hạn 30 phút</text><text x="56" y="1144" fill="#5f5f5a">Payload chỉ có sub, tv, iat, exp, iss, aud</text><text x="56" y="1163" fill="#5f5f5a">Không có role, email: payload ai cũng đọc được</text><text x="56" y="1182" fill="#5f5f5a">Response gắn Cache-Control: no-store</text><text x="56" y="1201" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">api/src/auth/jwt.js:18</text><line x1="80" y1="1218" x2="80" y2="1252" stroke="#1f5b43" stroke-width="2"/><path d="M75 1250 L80 1258 L85 1250Z" fill="#1f5b43"/><text x="90" y="1242" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="1258" width="520" height="119" rx="10" fill="#1f5b43" stroke="#1f5b43"/><text x="56" y="1284" font-weight="700" fill="#ffffff">Web lưu token vào sessionStorage</text><text x="56" y="1303" fill="#ffffff">Lý do: còn sau Reload, không sang tab mới, mất khi đóng tab,</text><text x="56" y="1322" fill="#ffffff">ngắn hơn localStorage. Rủi ro còn lại: XSS đọc được token,</text><text x="56" y="1341" fill="#ffffff">nên không render HTML thô, token ngắn hạn, tokenVersion thu hồi</text><text x="56" y="1360" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#d6e7de">web/src/auth/token.js:22</text>
<text x="40" y="1419" font-size="12" fill="#5f5f5a">Vẽ nháp từ mã nguồn Bài 2 ngày 09/11/2026 · file:dòng tính từ thư mục bai2/ · DB = bảng trong PostgreSQL · nhóm duyệt trước khi dùng.</text>
</svg>