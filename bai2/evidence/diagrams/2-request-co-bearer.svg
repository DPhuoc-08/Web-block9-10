<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1401" width="1100" height="1401" font-family="'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14">
<title>Một request có Bearer đi qua web và api</title>
<rect width="1100" height="1401" fill="#f7f6f3"/>
<text x="40" y="50" font-size="24" font-weight="700" fill="#1d1d1b">Một request có Bearer đi qua web và api</text>
<text x="40" y="78" fill="#5f5f5a">web/src/api/client.js → preflight → requireJwt → RBAC → ABAC · role luôn đọc từ DB</text>
<text x="80" y="104" font-size="12" font-weight="700" fill="#1f5b43" letter-spacing=".04em">LUỒNG CHÍNH (thứ tự trong code)</text>
<text x="650" y="104" font-size="12" font-weight="700" fill="#a8281d" letter-spacing=".04em">DỪNG Ở ĐÂY — không làm các bước bên dưới</text>
<rect x="40" y="112" width="520" height="62" rx="10" fill="#eef0f3" stroke="#d9d6cf"/><text x="56" y="138" font-weight="700" fill="#1d1d1b">Trang gọi hàm trong api/*.js</text><text x="56" y="157" fill="#5f5f5a">Trang không tự gắn header</text><line x1="80" y1="174" x2="80" y2="208" stroke="#1f5b43" stroke-width="2"/><path d="M75 206 L80 214 L85 206Z" fill="#1f5b43"/><text x="90" y="198" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="214" width="520" height="100" rx="10" fill="#e8f1ec" stroke="#b9d3c5"/><text x="56" y="240" font-weight="700" fill="#1d1d1b">Lớp gọi API gắn Authorization, một chỗ duy nhất</text><text x="56" y="259" fill="#5f5f5a">Chỉ cho URL gốc của api</text><text x="56" y="278" fill="#5f5f5a">GET /api/dishes, /:id: anonymous, không gửi token</text><text x="56" y="297" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">web/src/api/client.js:36</text><line x1="80" y1="314" x2="80" y2="348" stroke="#1f5b43" stroke-width="2"/><path d="M75 346 L80 354 L85 346Z" fill="#1f5b43"/><text x="90" y="338" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="354" width="520" height="100" rx="10" fill="#ffffff" stroke="#d9d6cf"/><rect x="40" y="354" width="5" height="100" rx="2" fill="#1f5b43"/><text x="56" y="380" font-weight="700" fill="#1d1d1b">Preflight OPTIONS (Authorization không được miễn)</text><text x="56" y="399" fill="#5f5f5a">Origin cụ thể từ CORS_ORIGIN, có Authorization trong</text><text x="56" y="418" fill="#5f5f5a">Allow-Headers, không đòi token</text><text x="56" y="437" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">api/src/app.js:40</text><rect x="650" y="354" width="410" height="62" rx="10" fill="#fbecea" stroke="#efc2bd"/><text x="666" y="380" font-weight="700" fill="#a8281d">Không có Allow-Origin</text><text x="666" y="399" fill="#a8281d">Trình duyệt không gửi request thật.</text><line x1="560" y1="380" x2="644" y2="380" stroke="#a8281d" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M642 375 L650 380 L642 385Z" fill="#a8281d"/><text x="605" y="373" font-size="12" text-anchor="middle" fill="#a8281d" font-weight="600">origin lạ</text><line x1="80" y1="454" x2="80" y2="488" stroke="#1f5b43" stroke-width="2"/><path d="M75 486 L80 494 L85 486Z" fill="#1f5b43"/><text x="90" y="478" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="494" width="520" height="81" rx="10" fill="#ffffff" stroke="#d9d6cf"/><rect x="40" y="494" width="5" height="81" rx="2" fill="#1f5b43"/><text x="56" y="520" font-weight="700" fill="#1d1d1b">Cổng 1, requireJwt: verify</text><text x="56" y="539" fill="#5f5f5a">Thuật toán cố định HS256, chữ ký, exp, iss, aud</text><text x="56" y="558" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">api/src/auth/jwt.js:23</text><rect x="650" y="494" width="410" height="43" rx="10" fill="#fbecea" stroke="#efc2bd"/><text x="666" y="520" font-weight="700" fill="#a8281d">401 UNAUTHENTICATED</text><line x1="560" y1="520" x2="644" y2="520" stroke="#a8281d" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M642 515 L650 520 L642 525Z" fill="#a8281d"/><text x="605" y="513" font-size="12" text-anchor="middle" fill="#a8281d" font-weight="600">sai</text><rect x="650" y="547" width="410" height="43" rx="10" fill="#fbecea" stroke="#efc2bd"/><text x="666" y="573" font-weight="700" fill="#a8281d">401 TOKEN_EXPIRED</text><line x1="560" y1="573" x2="644" y2="573" stroke="#a8281d" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M642 568 L650 573 L642 578Z" fill="#a8281d"/><text x="605" y="566" font-size="12" text-anchor="middle" fill="#a8281d" font-weight="600">quá exp</text><line x1="80" y1="590" x2="80" y2="624" stroke="#1f5b43" stroke-width="2"/><path d="M75 622 L80 630 L85 622Z" fill="#1f5b43"/><text x="90" y="614" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="630" width="520" height="100" rx="10" fill="#ffffff" stroke="#d9d6cf"/><rect x="40" y="630" width="5" height="100" rx="2" fill="#1f5b43"/><text x="56" y="656" font-weight="700" fill="#1d1d1b">Tải user theo sub: active, tv khớp tokenVersion</text><text x="56" y="675" fill="#5f5f5a">Role, chefId lấy ở đây, không lấy từ payload</text><text x="56" y="694" fill="#5f5f5a">Reset mật khẩu, tắt MFA tăng tokenVersion</text><text x="56" y="713" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">api/src/auth/require-jwt.js:25 · DB users</text><rect x="650" y="630" width="410" height="43" rx="10" fill="#fbecea" stroke="#efc2bd"/><text x="666" y="656" font-weight="700" fill="#a8281d">401 UNAUTHENTICATED</text><line x1="560" y1="656" x2="644" y2="656" stroke="#a8281d" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M642 651 L650 656 L642 661Z" fill="#a8281d"/><text x="605" y="649" font-size="12" text-anchor="middle" fill="#a8281d" font-weight="600">lệch</text><line x1="80" y1="730" x2="80" y2="764" stroke="#1f5b43" stroke-width="2"/><path d="M75 762 L80 770 L85 762Z" fill="#1f5b43"/><text x="90" y="754" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="770" width="520" height="62" rx="10" fill="#ffffff" stroke="#d9d6cf"/><rect x="40" y="770" width="5" height="62" rx="2" fill="#1f5b43"/><text x="56" y="796" font-weight="700" fill="#1d1d1b">Cổng 2, RBAC: requirePermission, trước jsonBody</text><text x="56" y="815" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">api/src/routes/dishes.js:181</text><rect x="650" y="770" width="410" height="62" rx="10" fill="#fbecea" stroke="#efc2bd"/><text x="666" y="796" font-weight="700" fill="#a8281d">403 FORBIDDEN</text><text x="666" y="815" fill="#a8281d">Dữ liệu không đổi.</text><line x1="560" y1="796" x2="644" y2="796" stroke="#a8281d" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M642 791 L650 796 L642 801Z" fill="#a8281d"/><text x="605" y="789" font-size="12" text-anchor="middle" fill="#a8281d" font-weight="600">thiếu role</text><line x1="80" y1="832" x2="80" y2="866" stroke="#1f5b43" stroke-width="2"/><path d="M75 864 L80 872 L85 864Z" fill="#1f5b43"/><text x="90" y="856" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="872" width="520" height="81" rx="10" fill="#ffffff" stroke="#d9d6cf"/><rect x="40" y="872" width="5" height="81" rx="2" fill="#1f5b43"/><text x="56" y="898" font-weight="700" fill="#1d1d1b">Cổng 3 và 4: đọc món từ DB, canEditDish</text><text x="56" y="917" fill="#5f5f5a">chefId, status trong body của Editor bị bỏ qua</text><text x="56" y="936" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">api/src/routes/dishes.js:137</text><rect x="650" y="872" width="410" height="43" rx="10" fill="#fbecea" stroke="#efc2bd"/><text x="666" y="898" font-weight="700" fill="#a8281d">200 NOT_FOUND</text><line x1="560" y1="898" x2="644" y2="898" stroke="#a8281d" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M642 893 L650 898 L642 903Z" fill="#a8281d"/><text x="605" y="891" font-size="12" text-anchor="middle" fill="#a8281d" font-weight="600">không có</text><rect x="650" y="925" width="410" height="43" rx="10" fill="#fbecea" stroke="#efc2bd"/><text x="666" y="951" font-weight="700" fill="#a8281d">403 FORBIDDEN</text><line x1="560" y1="951" x2="644" y2="951" stroke="#a8281d" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M642 946 L650 951 L642 956Z" fill="#a8281d"/><text x="605" y="944" font-size="12" text-anchor="middle" fill="#a8281d" font-weight="600">không thoả</text><line x1="80" y1="968" x2="80" y2="1002" stroke="#1f5b43" stroke-width="2"/><path d="M75 1000 L80 1008 L85 1000Z" fill="#1f5b43"/><text x="90" y="992" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="1008" width="520" height="62" rx="10" fill="#ffffff" stroke="#d9d6cf"/><rect x="40" y="1008" width="5" height="62" rx="2" fill="#1f5b43"/><text x="56" y="1034" font-weight="700" fill="#1d1d1b">Câu ghi đầu tiên của transaction có điều kiện ABAC</text><text x="56" y="1053" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">api/src/routes/dishes.js:200</text><rect x="650" y="1008" width="410" height="43" rx="10" fill="#fbecea" stroke="#efc2bd"/><text x="666" y="1034" font-weight="700" fill="#a8281d">Rollback, 403 hoặc NOT_FOUND</text><line x1="560" y1="1034" x2="644" y2="1034" stroke="#a8281d" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M642 1029 L650 1034 L642 1039Z" fill="#a8281d"/><text x="605" y="1027" font-size="12" text-anchor="middle" fill="#a8281d" font-weight="600">count = 0</text><line x1="80" y1="1070" x2="80" y2="1104" stroke="#1f5b43" stroke-width="2"/><path d="M75 1102 L80 1110 L85 1102Z" fill="#1f5b43"/><text x="90" y="1094" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="1110" width="520" height="62" rx="10" fill="#1f5b43" stroke="#1f5b43"/><text x="56" y="1136" font-weight="700" fill="#ffffff">200 ok: true</text><text x="56" y="1155" fill="#ffffff">Web cập nhật giao diện; trang không tự giữ dữ liệu cũ</text><line x1="80" y1="1172" x2="80" y2="1206" stroke="#1f5b43" stroke-width="2"/><path d="M75 1204 L80 1212 L85 1204Z" fill="#1f5b43"/><text x="90" y="1196" font-size="12" fill="#1f5b43" font-weight="600">khi bị từ chối, lớp gọi API xử lý theo status</text><rect x="40" y="1212" width="520" height="119" rx="10" fill="#ffffff" stroke="#d9d6cf"/><rect x="40" y="1212" width="5" height="119" rx="2" fill="#1f5b43"/><text x="56" y="1238" font-weight="700" fill="#1d1d1b">Web xử lý theo status</text><text x="56" y="1257" fill="#5f5f5a">401: xoá token, nhớ trang đang mở, về đăng nhập</text><text x="56" y="1276" fill="#5f5f5a">403: báo thiếu quyền, GIỮ token</text><text x="56" y="1295" fill="#5f5f5a">Lỗi mạng, 500: báo lỗi kỹ thuật, KHÔNG đăng xuất</text><text x="56" y="1314" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">web/src/api/client.js:64</text>
<text x="40" y="1373" font-size="12" fill="#5f5f5a">Vẽ nháp từ mã nguồn Bài 2 ngày 09/11/2026 · file:dòng tính từ thư mục bai2/ · DB = bảng trong PostgreSQL · nhóm duyệt trước khi dùng.</text>
</svg>