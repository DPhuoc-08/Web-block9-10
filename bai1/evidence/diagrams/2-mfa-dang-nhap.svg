<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1307" width="1100" height="1307" font-family="'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14">
<title>Đăng nhập có MFA</title>
<rect width="1100" height="1307" fill="#f7f6f3"/>
<text x="40" y="50" font-size="24" font-weight="700" fill="#1d1d1b">Đăng nhập có MFA</text>
<text x="40" y="78" fill="#5f5f5a">POST /login → phiên chờ → POST /login/mfa · password đúng chưa phải là đăng nhập xong</text>
<text x="80" y="104" font-size="12" font-weight="700" fill="#1f5b43" letter-spacing=".04em">LUỒNG CHÍNH (thứ tự trong code)</text>
<text x="650" y="104" font-size="12" font-weight="700" fill="#a8281d" letter-spacing=".04em">DỪNG Ở ĐÂY — không làm các bước bên dưới</text>
<rect x="40" y="112" width="520" height="62" rx="10" fill="#eef0f3" stroke="#d9d6cf"/><text x="56" y="138" font-weight="700" fill="#1d1d1b">POST /login: các bước của block8 giữ nguyên</text><text x="56" y="157" fill="#5f5f5a">CSRF → giới hạn IP → khoá email → CAPTCHA → password → active</text><line x1="80" y1="174" x2="80" y2="208" stroke="#1f5b43" stroke-width="2"/><path d="M75 206 L80 214 L85 206Z" fill="#1f5b43"/><text x="90" y="198" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="214" width="520" height="62" rx="10" fill="#ffffff" stroke="#d9d6cf"/><rect x="40" y="214" width="5" height="62" rx="2" fill="#1f5b43"/><text x="56" y="240" font-weight="700" fill="#1d1d1b">Tài khoản đã bật MFA?</text><text x="56" y="259" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">routes/auth/login.js:127</text><rect x="650" y="214" width="410" height="62" rx="10" fill="#fdf3dc" stroke="#ecd9a8"/><text x="666" y="240" font-weight="700" fill="#8a5a00">Phiên đầy đủ như block8</text><text x="666" y="259" fill="#5f5f5a">regenerate, gán userId, 303 trang đang mở.</text><line x1="560" y1="240" x2="644" y2="240" stroke="#a8281d" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M642 235 L650 240 L642 245Z" fill="#a8281d"/><text x="605" y="233" font-size="12" text-anchor="middle" fill="#a8281d" font-weight="600">chưa bật</text><line x1="80" y1="276" x2="80" y2="310" stroke="#1f5b43" stroke-width="2"/><path d="M75 308 L80 316 L85 308Z" fill="#1f5b43"/><text x="90" y="300" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="316" width="520" height="100" rx="10" fill="#e8f1ec" stroke="#b9d3c5"/><text x="56" y="342" font-weight="700" fill="#1d1d1b">regenerate, chỉ gán mfaPending = { userId, at, next }</text><text x="56" y="361" fill="#5f5f5a">KHÔNG gán session.userId</text><text x="56" y="380" fill="#5f5f5a">Cột sessions.userId vẫn ghi để reset xoá được phiên đang chờ</text><text x="56" y="399" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">routes/auth/login.js:123 · DB sessions</text><rect x="650" y="316" width="410" height="100" rx="10" fill="#fdf3dc" stroke="#ecd9a8"/><text x="666" y="342" font-weight="700" fill="#8a5a00">303 /login</text><text x="666" y="361" fill="#5f5f5a">loadUser chỉ đọc session.userId,</text><text x="666" y="380" fill="#5f5f5a">nên phiên chờ không có currentUser.</text><text x="666" y="399" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">auth/load-user.js, auth/require-login.js</text><line x1="560" y1="342" x2="644" y2="342" stroke="#a8281d" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M642 337 L650 342 L642 347Z" fill="#a8281d"/><text x="605" y="335" font-size="12" text-anchor="middle" fill="#a8281d" font-weight="600">gọi /admin/*</text><line x1="80" y1="416" x2="80" y2="450" stroke="#1f5b43" stroke-width="2"/><path d="M75 448 L80 456 L85 448Z" fill="#1f5b43"/><text x="90" y="440" font-size="12" fill="#1f5b43" font-weight="600">303 /login/mfa</text><rect x="40" y="456" width="520" height="81" rx="10" fill="#ffffff" stroke="#d9d6cf"/><rect x="40" y="456" width="5" height="81" rx="2" fill="#1f5b43"/><text x="56" y="482" font-weight="700" fill="#1d1d1b">requireMfaPending: chỉ gắn cho route bước MFA</text><text x="56" y="501" fill="#5f5f5a">Còn phiên chờ, chưa quá 5 phút</text><text x="56" y="520" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">auth/require-mfa-pending.js:5</text><rect x="650" y="456" width="410" height="62" rx="10" fill="#fbecea" stroke="#efc2bd"/><text x="666" y="482" font-weight="700" fill="#a8281d">303 /login?msg=mfa-expired</text><text x="666" y="501" fill="#a8281d">Nhập lại password.</text><line x1="560" y1="482" x2="644" y2="482" stroke="#a8281d" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M642 477 L650 482 L642 487Z" fill="#a8281d"/><text x="605" y="475" font-size="12" text-anchor="middle" fill="#a8281d" font-weight="600">hết hạn</text><line x1="80" y1="537" x2="80" y2="571" stroke="#1f5b43" stroke-width="2"/><path d="M75 569 L80 577 L85 569Z" fill="#1f5b43"/><text x="90" y="561" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="577" width="520" height="119" rx="10" fill="#ffffff" stroke="#d9d6cf"/><rect x="40" y="577" width="5" height="119" rx="2" fill="#1f5b43"/><text x="56" y="603" font-weight="700" fill="#1d1d1b">Giới hạn IP 30 lần / 15 phút, rồi GIỮ LƯỢT trong bộ đếm theo user</text><text x="56" y="622" fill="#5f5f5a">mfa-fail:user:&lt;id&gt; dùng chung cho OTP, recovery code, xác thực lại</text><text x="56" y="641" fill="#5f5f5a">hit() là một câu ghi: N request cùng lúc nhận N lượt khác nhau,</text><text x="56" y="660" fill="#5f5f5a">chỉ lượt 1–5 được kiểm mã (sửa 12/11, plan 14 L1)</text><text x="56" y="679" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">routes/auth/mfa.js:57 · auth/mfa.js:26 · DB rate_limits</text><rect x="650" y="577" width="410" height="62" rx="10" fill="#fbecea" stroke="#efc2bd"/><text x="666" y="603" font-weight="700" fill="#a8281d">429 + Retry-After</text><text x="666" y="622" fill="#a8281d">Kể cả khi mã đúng; không kiểm mã.</text><line x1="560" y1="603" x2="644" y2="603" stroke="#a8281d" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M642 598 L650 603 L642 608Z" fill="#a8281d"/><text x="605" y="596" font-size="12" text-anchor="middle" fill="#a8281d" font-weight="600">đang khoá, lượt &gt; 5</text><line x1="80" y1="696" x2="80" y2="730" stroke="#1f5b43" stroke-width="2"/><path d="M75 728 L80 736 L85 728Z" fill="#1f5b43"/><text x="90" y="720" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="736" width="520" height="100" rx="10" fill="#ffffff" stroke="#d9d6cf"/><rect x="40" y="736" width="5" height="100" rx="2" fill="#1f5b43"/><text x="56" y="762" font-weight="700" fill="#1d1d1b">Mã đúng? TOTP 6 số, tối đa ±1 bước 30 giây</text><text x="56" y="781" fill="#5f5f5a">Giải mã mfaSecret (AES-256-GCM, AAD là userId)</text><text x="56" y="800" fill="#5f5f5a">Hoặc recovery code: HMAC-SHA256 so với codeHash</text><text x="56" y="819" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">auth/mfa.js:40</text><rect x="650" y="736" width="410" height="81" rx="10" fill="#fbecea" stroke="#efc2bd"/><text x="666" y="762" font-weight="700" fill="#a8281d">200 INVALID_OTP; lượt thứ 5 sai → khoá 15 phút</text><text x="666" y="781" fill="#a8281d">Lượt đã giữ từ trước nên không cộng thêm.</text><text x="666" y="800" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">auth/mfa.js:34</text><line x1="560" y1="762" x2="644" y2="762" stroke="#a8281d" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M642 757 L650 762 L642 767Z" fill="#a8281d"/><text x="605" y="755" font-size="12" text-anchor="middle" fill="#a8281d" font-weight="600">sai</text><line x1="80" y1="836" x2="80" y2="870" stroke="#1f5b43" stroke-width="2"/><path d="M75 868 L80 876 L85 868Z" fill="#1f5b43"/><text x="90" y="860" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="876" width="520" height="119" rx="10" fill="#ffffff" stroke="#d9d6cf"/><rect x="40" y="876" width="5" height="119" rx="2" fill="#1f5b43"/><text x="56" y="902" font-weight="700" fill="#1d1d1b">Tiêu thụ bằng câu ghi có điều kiện</text><text x="56" y="921" fill="#5f5f5a">TOTP: mfaLastStep rỗng hoặc nhỏ hơn bước của mã</text><text x="56" y="940" fill="#5f5f5a">Recovery: usedAt: null → đặt usedAt = now</text><text x="56" y="959" fill="#5f5f5a">Hai request cùng mã: chỉ một request khớp</text><text x="56" y="978" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">auth/mfa.js:45 · DB users, recovery_codes</text><rect x="650" y="876" width="410" height="62" rx="10" fill="#fbecea" stroke="#efc2bd"/><text x="666" y="902" font-weight="700" fill="#a8281d">200 INVALID_OTP</text><text x="666" y="921" fill="#a8281d">Mã đã dùng bị từ chối.</text><line x1="560" y1="902" x2="644" y2="902" stroke="#a8281d" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M642 897 L650 902 L642 907Z" fill="#a8281d"/><text x="605" y="895" font-size="12" text-anchor="middle" fill="#a8281d" font-weight="600">count = 0</text><line x1="80" y1="995" x2="80" y2="1029" stroke="#1f5b43" stroke-width="2"/><path d="M75 1027 L80 1035 L85 1027Z" fill="#1f5b43"/><text x="90" y="1019" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="1035" width="520" height="81" rx="10" fill="#e8f1ec" stroke="#b9d3c5"/><text x="56" y="1061" font-weight="700" fill="#1d1d1b">Xoá bộ đếm, đọc lại user, regenerate sid MỚI</text><text x="56" y="1080" fill="#5f5f5a">Gán userId, loginAt, xoá mfaPending (phiên cũ bị huỷ)</text><text x="56" y="1099" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">routes/auth/mfa.js:46 · routes/auth/mfa.js:47</text><line x1="80" y1="1116" x2="80" y2="1150" stroke="#1f5b43" stroke-width="2"/><path d="M75 1148 L80 1156 L85 1148Z" fill="#1f5b43"/><text x="90" y="1140" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="1156" width="520" height="81" rx="10" fill="#1f5b43" stroke="#1f5b43"/><text x="56" y="1182" font-weight="700" fill="#ffffff">303 trang đang mở; dùng recovery code thì về hồ sơ</text><text x="56" y="1201" fill="#ffffff">Set-Cookie: sid mới · HttpOnly; SameSite=Lax; Path=/</text><text x="56" y="1220" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#d6e7de">routes/auth/mfa.js:77</text>
<text x="40" y="1279" font-size="12" fill="#5f5f5a">Vẽ nháp từ mã nguồn Bài 1 ngày 09/11/2026 · file:dòng trỏ vào source-code/src/ · DB = bảng trong PostgreSQL · nhóm duyệt trước khi dùng.</text>
</svg>