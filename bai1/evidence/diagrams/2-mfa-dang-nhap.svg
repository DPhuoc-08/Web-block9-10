<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1466" width="1100" height="1466" font-family="'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14">
<title>Đăng nhập có MFA</title>
<rect width="1100" height="1466" fill="#f7f6f3"/>
<text x="40" y="50" font-size="24" font-weight="700" fill="#1d1d1b">Đăng nhập có MFA</text>
<text x="40" y="78" fill="#5f5f5a">POST /login → challenge (cookie mfa) → POST /login/mfa → access + refresh · password đúng chưa phải là đăng nhập xong</text>
<text x="80" y="104" font-size="12" font-weight="700" fill="#1f5b43" letter-spacing=".04em">LUỒNG CHÍNH (thứ tự trong code)</text>
<text x="650" y="104" font-size="12" font-weight="700" fill="#a8281d" letter-spacing=".04em">DỪNG Ở ĐÂY — không làm các bước bên dưới</text>
<rect x="40" y="112" width="520" height="62" rx="10" fill="#eef0f3" stroke="#d9d6cf"/><text x="56" y="138" font-weight="700" fill="#1d1d1b">POST /login: các bước của block8 giữ nguyên</text><text x="56" y="157" fill="#5f5f5a">CSRF → giới hạn IP → khoá email → CAPTCHA → password → active</text><line x1="80" y1="174" x2="80" y2="208" stroke="#1f5b43" stroke-width="2"/><path d="M75 206 L80 214 L85 206Z" fill="#1f5b43"/><text x="90" y="198" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="214" width="520" height="62" rx="10" fill="#ffffff" stroke="#d9d6cf"/><rect x="40" y="214" width="5" height="62" rx="2" fill="#1f5b43"/><text x="56" y="240" font-weight="700" fill="#1d1d1b">Tài khoản đã bật MFA?</text><text x="56" y="259" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">routes/auth/login.js:135</text><rect x="650" y="214" width="410" height="81" rx="10" fill="#fdf3dc" stroke="#ecd9a8"/><text x="666" y="240" font-weight="700" fill="#8a5a00">Cấp access + refresh ngay</text><text x="666" y="259" fill="#5f5f5a">Family mới, 303 trang đang mở (sơ đồ 4).</text><text x="666" y="278" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">routes/auth/login.js:138</text><line x1="560" y1="240" x2="644" y2="240" stroke="#a8281d" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M642 235 L650 240 L642 245Z" fill="#a8281d"/><text x="605" y="233" font-size="12" text-anchor="middle" fill="#a8281d" font-weight="600">chưa bật</text><line x1="80" y1="295" x2="80" y2="329" stroke="#1f5b43" stroke-width="2"/><path d="M75 327 L80 335 L85 327Z" fill="#1f5b43"/><text x="90" y="319" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="335" width="520" height="100" rx="10" fill="#e8f1ec" stroke="#b9d3c5"/><text x="56" y="361" font-weight="700" fill="#1d1d1b">Chỉ cấp challenge: chuỗi ngẫu nhiên, hạn 5 phút, dùng một lần</text><text x="56" y="380" fill="#5f5f5a">Cookie mfa HttpOnly, Path=/login/mfa · DB mfa_challenges chỉ lưu SHA-256</text><text x="56" y="399" fill="#5f5f5a">KHÔNG có access, KHÔNG có refresh token</text><text x="56" y="418" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">auth/mfa-challenge.js:10 · DB mfa_challenges</text><rect x="650" y="335" width="410" height="100" rx="10" fill="#fdf3dc" stroke="#ecd9a8"/><text x="666" y="361" font-weight="700" fill="#8a5a00">303 /login</text><text x="666" y="380" fill="#5f5f5a">Challenge không phải JWT, loadUser không nhận,</text><text x="666" y="399" fill="#5f5f5a">cookie mfa cũng không được gửi ngoài /login/mfa.</text><text x="666" y="418" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">auth/load-user.js, auth/require-login.js</text><line x1="560" y1="361" x2="644" y2="361" stroke="#a8281d" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M642 356 L650 361 L642 366Z" fill="#a8281d"/><text x="605" y="354" font-size="12" text-anchor="middle" fill="#a8281d" font-weight="600">gọi /admin/*</text><line x1="80" y1="435" x2="80" y2="469" stroke="#1f5b43" stroke-width="2"/><path d="M75 467 L80 475 L85 467Z" fill="#1f5b43"/><text x="90" y="459" font-size="12" fill="#1f5b43" font-weight="600">303 /login/mfa</text><rect x="40" y="475" width="520" height="100" rx="10" fill="#ffffff" stroke="#d9d6cf"/><rect x="40" y="475" width="5" height="100" rx="2" fill="#1f5b43"/><text x="56" y="501" font-weight="700" fill="#1d1d1b">requireMfaPending: chỉ gắn cho route bước MFA</text><text x="56" y="520" fill="#5f5f5a">Tra hash challenge: còn, chưa dùng, chưa quá 5 phút</text><text x="56" y="539" fill="#5f5f5a">Đặt lại / đổi mật khẩu xoá luôn challenge đang chờ (L5)</text><text x="56" y="558" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">auth/require-mfa-pending.js:7</text><rect x="650" y="475" width="410" height="62" rx="10" fill="#fbecea" stroke="#efc2bd"/><text x="666" y="501" font-weight="700" fill="#a8281d">303 /login?msg=mfa-expired</text><text x="666" y="520" fill="#a8281d">Nhập lại password.</text><line x1="560" y1="501" x2="644" y2="501" stroke="#a8281d" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M642 496 L650 501 L642 506Z" fill="#a8281d"/><text x="605" y="494" font-size="12" text-anchor="middle" fill="#a8281d" font-weight="600">hết hạn</text><line x1="80" y1="575" x2="80" y2="609" stroke="#1f5b43" stroke-width="2"/><path d="M75 607 L80 615 L85 607Z" fill="#1f5b43"/><text x="90" y="599" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="615" width="520" height="119" rx="10" fill="#ffffff" stroke="#d9d6cf"/><rect x="40" y="615" width="5" height="119" rx="2" fill="#1f5b43"/><text x="56" y="641" font-weight="700" fill="#1d1d1b">Giới hạn IP 30 lần / 15 phút, rồi GIỮ LƯỢT trong bộ đếm theo user</text><text x="56" y="660" fill="#5f5f5a">mfa-fail:user:&lt;id&gt; dùng chung cho OTP, recovery code, xác thực lại</text><text x="56" y="679" fill="#5f5f5a">hit() là một câu ghi: N request cùng lúc nhận N lượt khác nhau,</text><text x="56" y="698" fill="#5f5f5a">chỉ lượt 1–5 được kiểm mã (sửa 12/11, plan 14 L1)</text><text x="56" y="717" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">routes/auth/mfa.js:57 · auth/mfa.js:26 · DB rate_limits</text><rect x="650" y="615" width="410" height="62" rx="10" fill="#fbecea" stroke="#efc2bd"/><text x="666" y="641" font-weight="700" fill="#a8281d">429 + Retry-After</text><text x="666" y="660" fill="#a8281d">Kể cả khi mã đúng; không kiểm mã.</text><line x1="560" y1="641" x2="644" y2="641" stroke="#a8281d" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M642 636 L650 641 L642 646Z" fill="#a8281d"/><text x="605" y="634" font-size="12" text-anchor="middle" fill="#a8281d" font-weight="600">đang khoá, lượt &gt; 5</text><line x1="80" y1="734" x2="80" y2="768" stroke="#1f5b43" stroke-width="2"/><path d="M75 766 L80 774 L85 766Z" fill="#1f5b43"/><text x="90" y="758" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="774" width="520" height="100" rx="10" fill="#ffffff" stroke="#d9d6cf"/><rect x="40" y="774" width="5" height="100" rx="2" fill="#1f5b43"/><text x="56" y="800" font-weight="700" fill="#1d1d1b">Mã đúng? TOTP 6 số, tối đa ±1 bước 30 giây</text><text x="56" y="819" fill="#5f5f5a">Giải mã mfaSecret (AES-256-GCM, AAD là userId)</text><text x="56" y="838" fill="#5f5f5a">Hoặc recovery code: HMAC-SHA256 so với codeHash</text><text x="56" y="857" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">auth/mfa.js:40</text><rect x="650" y="774" width="410" height="81" rx="10" fill="#fbecea" stroke="#efc2bd"/><text x="666" y="800" font-weight="700" fill="#a8281d">200 INVALID_OTP; lượt thứ 5 sai → khoá 15 phút</text><text x="666" y="819" fill="#a8281d">Lượt đã giữ từ trước nên không cộng thêm.</text><text x="666" y="838" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">auth/mfa.js:34</text><line x1="560" y1="800" x2="644" y2="800" stroke="#a8281d" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M642 795 L650 800 L642 805Z" fill="#a8281d"/><text x="605" y="793" font-size="12" text-anchor="middle" fill="#a8281d" font-weight="600">sai</text><line x1="80" y1="874" x2="80" y2="908" stroke="#1f5b43" stroke-width="2"/><path d="M75 906 L80 914 L85 906Z" fill="#1f5b43"/><text x="90" y="898" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="914" width="520" height="119" rx="10" fill="#ffffff" stroke="#d9d6cf"/><rect x="40" y="914" width="5" height="119" rx="2" fill="#1f5b43"/><text x="56" y="940" font-weight="700" fill="#1d1d1b">Tiêu thụ mã bằng câu ghi có điều kiện</text><text x="56" y="959" fill="#5f5f5a">TOTP: mfaLastStep rỗng hoặc nhỏ hơn bước của mã</text><text x="56" y="978" fill="#5f5f5a">Recovery: usedAt: null → đặt usedAt = now</text><text x="56" y="997" fill="#5f5f5a">Hai request cùng mã: chỉ một request khớp</text><text x="56" y="1016" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">auth/mfa.js:45 · DB users, recovery_codes</text><rect x="650" y="914" width="410" height="62" rx="10" fill="#fbecea" stroke="#efc2bd"/><text x="666" y="940" font-weight="700" fill="#a8281d">200 INVALID_OTP</text><text x="666" y="959" fill="#a8281d">Mã đã dùng bị từ chối.</text><line x1="560" y1="940" x2="644" y2="940" stroke="#a8281d" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M642 935 L650 940 L642 945Z" fill="#a8281d"/><text x="605" y="933" font-size="12" text-anchor="middle" fill="#a8281d" font-weight="600">count = 0</text><line x1="80" y1="1033" x2="80" y2="1067" stroke="#1f5b43" stroke-width="2"/><path d="M75 1065 L80 1073 L85 1065Z" fill="#1f5b43"/><text x="90" y="1057" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="1073" width="520" height="81" rx="10" fill="#ffffff" stroke="#d9d6cf"/><rect x="40" y="1073" width="5" height="81" rx="2" fill="#1f5b43"/><text x="56" y="1099" font-weight="700" fill="#1d1d1b">Tiêu thụ challenge (usedAt: null → now), đọc lại user</text><text x="56" y="1118" fill="#5f5f5a">Challenge dùng một lần; user còn active, còn bật MFA</text><text x="56" y="1137" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">routes/auth/mfa.js:45 · DB mfa_challenges</text><rect x="650" y="1073" width="410" height="62" rx="10" fill="#fbecea" stroke="#efc2bd"/><text x="666" y="1099" font-weight="700" fill="#a8281d">303 /login</text><text x="666" y="1118" fill="#a8281d">Không cấp token.</text><line x1="560" y1="1099" x2="644" y2="1099" stroke="#a8281d" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M642 1094 L650 1099 L642 1104Z" fill="#a8281d"/><text x="605" y="1092" font-size="12" text-anchor="middle" fill="#a8281d" font-weight="600">đã dùng</text><line x1="80" y1="1154" x2="80" y2="1188" stroke="#1f5b43" stroke-width="2"/><path d="M75 1186 L80 1194 L85 1186Z" fill="#1f5b43"/><text x="90" y="1178" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="1194" width="520" height="81" rx="10" fill="#e8f1ec" stroke="#b9d3c5"/><text x="56" y="1220" font-weight="700" fill="#1d1d1b">Cấp access (JWT 90 giây) + refresh (family mới)</text><text x="56" y="1239" fill="#5f5f5a">Xoá cookie mfa, bỏ CSRF cũ</text><text x="56" y="1258" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">routes/auth/mfa.js:49</text><line x1="80" y1="1275" x2="80" y2="1309" stroke="#1f5b43" stroke-width="2"/><path d="M75 1307 L80 1315 L85 1307Z" fill="#1f5b43"/><text x="90" y="1299" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="1315" width="520" height="81" rx="10" fill="#1f5b43" stroke="#1f5b43"/><text x="56" y="1341" font-weight="700" fill="#ffffff">303 trang đang mở; dùng recovery code thì về hồ sơ</text><text x="56" y="1360" fill="#ffffff">Set-Cookie: access, refresh · HttpOnly; SameSite=Lax; Path=/</text><text x="56" y="1379" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#d6e7de">routes/auth/mfa.js:77</text>
<text x="40" y="1438" font-size="12" fill="#5f5f5a">Vẽ nháp từ mã nguồn Bài 1, cập nhật 13/11/2026 (JWT access + refresh, plan mục 15) · file:dòng trỏ vào source-code/src/ · DB = bảng trong PostgreSQL · nhóm duyệt trước khi dùng.</text>
</svg>