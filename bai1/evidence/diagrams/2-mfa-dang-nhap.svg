<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1288" width="1100" height="1288" font-family="'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14">
<title>Đăng nhập có MFA</title>
<rect width="1100" height="1288" fill="#f7f6f3"/>
<text x="40" y="50" font-size="24" font-weight="700" fill="#1d1d1b">Đăng nhập có MFA</text>
<text x="40" y="78" fill="#5f5f5a">POST /login → phiên chờ → POST /login/mfa · password đúng chưa phải là đăng nhập xong</text>
<text x="80" y="104" font-size="12" font-weight="700" fill="#1f5b43" letter-spacing=".04em">LUỒNG CHÍNH (thứ tự trong code)</text>
<text x="650" y="104" font-size="12" font-weight="700" fill="#a8281d" letter-spacing=".04em">DỪNG Ở ĐÂY — không làm các bước bên dưới</text>
<rect x="40" y="112" width="520" height="62" rx="10" fill="#eef0f3" stroke="#d9d6cf"/><text x="56" y="138" font-weight="700" fill="#1d1d1b">POST /login: các bước của block8 giữ nguyên</text><text x="56" y="157" fill="#5f5f5a">CSRF → giới hạn IP → khoá email → CAPTCHA → password → active</text><line x1="80" y1="174" x2="80" y2="208" stroke="#1f5b43" stroke-width="2"/><path d="M75 206 L80 214 L85 206Z" fill="#1f5b43"/><text x="90" y="198" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="214" width="520" height="62" rx="10" fill="#ffffff" stroke="#d9d6cf"/><rect x="40" y="214" width="5" height="62" rx="2" fill="#1f5b43"/><text x="56" y="240" font-weight="700" fill="#1d1d1b">Tài khoản đã bật MFA?</text><text x="56" y="259" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">routes/auth/login.js:127</text><rect x="650" y="214" width="410" height="62" rx="10" fill="#fdf3dc" stroke="#ecd9a8"/><text x="666" y="240" font-weight="700" fill="#8a5a00">Phiên đầy đủ như block8</text><text x="666" y="259" fill="#5f5f5a">regenerate, gán userId, 303 trang đang mở.</text><line x1="560" y1="240" x2="644" y2="240" stroke="#a8281d" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M642 235 L650 240 L642 245Z" fill="#a8281d"/><text x="605" y="233" font-size="12" text-anchor="middle" fill="#a8281d" font-weight="600">chưa bật</text><line x1="80" y1="276" x2="80" y2="310" stroke="#1f5b43" stroke-width="2"/><path d="M75 308 L80 316 L85 308Z" fill="#1f5b43"/><text x="90" y="300" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="316" width="520" height="100" rx="10" fill="#e8f1ec" stroke="#b9d3c5"/><text x="56" y="342" font-weight="700" fill="#1d1d1b">regenerate, chỉ gán mfaPending = { userId, at, next }</text><text x="56" y="361" fill="#5f5f5a">KHÔNG gán session.userId</text><text x="56" y="380" fill="#5f5f5a">Cột sessions.userId vẫn ghi để reset xoá được phiên đang chờ</text><text x="56" y="399" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">routes/auth/login.js:123 · DB sessions</text><rect x="650" y="316" width="410" height="100" rx="10" fill="#fdf3dc" stroke="#ecd9a8"/><text x="666" y="342" font-weight="700" fill="#8a5a00">303 /login</text><text x="666" y="361" fill="#5f5f5a">loadUser chỉ đọc session.userId,</text><text x="666" y="380" fill="#5f5f5a">nên phiên chờ không có currentUser.</text><text x="666" y="399" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">auth/load-user.js, auth/require-login.js</text><line x1="560" y1="342" x2="644" y2="342" stroke="#a8281d" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M642 337 L650 342 L642 347Z" fill="#a8281d"/><text x="605" y="335" font-size="12" text-anchor="middle" fill="#a8281d" font-weight="600">gọi /admin/*</text><line x1="80" y1="416" x2="80" y2="450" stroke="#1f5b43" stroke-width="2"/><path d="M75 448 L80 456 L85 448Z" fill="#1f5b43"/><text x="90" y="440" font-size="12" fill="#1f5b43" font-weight="600">303 /login/mfa</text><rect x="40" y="456" width="520" height="81" rx="10" fill="#ffffff" stroke="#d9d6cf"/><rect x="40" y="456" width="5" height="81" rx="2" fill="#1f5b43"/><text x="56" y="482" font-weight="700" fill="#1d1d1b">requireMfaPending: chỉ gắn cho route bước MFA</text><text x="56" y="501" fill="#5f5f5a">Còn phiên chờ, chưa quá 5 phút</text><text x="56" y="520" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">auth/require-mfa-pending.js:5</text><rect x="650" y="456" width="410" height="62" rx="10" fill="#fbecea" stroke="#efc2bd"/><text x="666" y="482" font-weight="700" fill="#a8281d">303 /login?msg=mfa-expired</text><text x="666" y="501" fill="#a8281d">Nhập lại password.</text><line x1="560" y1="482" x2="644" y2="482" stroke="#a8281d" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M642 477 L650 482 L642 487Z" fill="#a8281d"/><text x="605" y="475" font-size="12" text-anchor="middle" fill="#a8281d" font-weight="600">hết hạn</text><line x1="80" y1="537" x2="80" y2="571" stroke="#1f5b43" stroke-width="2"/><path d="M75 569 L80 577 L85 569Z" fill="#1f5b43"/><text x="90" y="561" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="577" width="520" height="100" rx="10" fill="#ffffff" stroke="#d9d6cf"/><rect x="40" y="577" width="5" height="100" rx="2" fill="#1f5b43"/><text x="56" y="603" font-weight="700" fill="#1d1d1b">Đang khoá? (bộ đếm chung theo user)</text><text x="56" y="622" fill="#5f5f5a">mfa-fail:user:&lt;id&gt; dùng chung cho OTP, recovery code,</text><text x="56" y="641" fill="#5f5f5a">bước xác thực lại</text><text x="56" y="660" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">auth/mfa.js:22 · DB rate_limits</text><rect x="650" y="577" width="410" height="62" rx="10" fill="#fbecea" stroke="#efc2bd"/><text x="666" y="603" font-weight="700" fill="#a8281d">429 + Retry-After</text><text x="666" y="622" fill="#a8281d">Kể cả khi mã đúng.</text><line x1="560" y1="603" x2="644" y2="603" stroke="#a8281d" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M642 598 L650 603 L642 608Z" fill="#a8281d"/><text x="605" y="596" font-size="12" text-anchor="middle" fill="#a8281d" font-weight="600">đang khoá</text><line x1="80" y1="677" x2="80" y2="711" stroke="#1f5b43" stroke-width="2"/><path d="M75 709 L80 717 L85 709Z" fill="#1f5b43"/><text x="90" y="701" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="717" width="520" height="100" rx="10" fill="#ffffff" stroke="#d9d6cf"/><rect x="40" y="717" width="5" height="100" rx="2" fill="#1f5b43"/><text x="56" y="743" font-weight="700" fill="#1d1d1b">Mã đúng? TOTP 6 số, tối đa ±1 bước 30 giây</text><text x="56" y="762" fill="#5f5f5a">Giải mã mfaSecret (AES-256-GCM, AAD là userId)</text><text x="56" y="781" fill="#5f5f5a">Hoặc recovery code: HMAC-SHA256 so với codeHash</text><text x="56" y="800" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">auth/mfa.js:35</text><rect x="650" y="717" width="410" height="81" rx="10" fill="#fbecea" stroke="#efc2bd"/><text x="666" y="743" font-weight="700" fill="#a8281d">200 INVALID_OTP, bộ đếm + 1</text><text x="666" y="762" fill="#a8281d">Đủ 5 lần trong 15 phút → khoá 15 phút, 429.</text><text x="666" y="781" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">auth/mfa.js:28</text><line x1="560" y1="743" x2="644" y2="743" stroke="#a8281d" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M642 738 L650 743 L642 748Z" fill="#a8281d"/><text x="605" y="736" font-size="12" text-anchor="middle" fill="#a8281d" font-weight="600">sai</text><line x1="80" y1="817" x2="80" y2="851" stroke="#1f5b43" stroke-width="2"/><path d="M75 849 L80 857 L85 849Z" fill="#1f5b43"/><text x="90" y="841" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="857" width="520" height="119" rx="10" fill="#ffffff" stroke="#d9d6cf"/><rect x="40" y="857" width="5" height="119" rx="2" fill="#1f5b43"/><text x="56" y="883" font-weight="700" fill="#1d1d1b">Tiêu thụ bằng câu ghi có điều kiện</text><text x="56" y="902" fill="#5f5f5a">TOTP: mfaLastStep rỗng hoặc nhỏ hơn bước của mã</text><text x="56" y="921" fill="#5f5f5a">Recovery: usedAt: null → đặt usedAt = now</text><text x="56" y="940" fill="#5f5f5a">Hai request cùng mã: chỉ một request khớp</text><text x="56" y="959" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">auth/mfa.js:40 · DB users, recovery_codes</text><rect x="650" y="857" width="410" height="62" rx="10" fill="#fbecea" stroke="#efc2bd"/><text x="666" y="883" font-weight="700" fill="#a8281d">200 INVALID_OTP</text><text x="666" y="902" fill="#a8281d">Mã đã dùng bị từ chối.</text><line x1="560" y1="883" x2="644" y2="883" stroke="#a8281d" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M642 878 L650 883 L642 888Z" fill="#a8281d"/><text x="605" y="876" font-size="12" text-anchor="middle" fill="#a8281d" font-weight="600">count = 0</text><line x1="80" y1="976" x2="80" y2="1010" stroke="#1f5b43" stroke-width="2"/><path d="M75 1008 L80 1016 L85 1008Z" fill="#1f5b43"/><text x="90" y="1000" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="1016" width="520" height="81" rx="10" fill="#e8f1ec" stroke="#b9d3c5"/><text x="56" y="1042" font-weight="700" fill="#1d1d1b">Xoá bộ đếm, đọc lại user, regenerate sid MỚI</text><text x="56" y="1061" fill="#5f5f5a">Gán userId, loginAt, xoá mfaPending (phiên cũ bị huỷ)</text><text x="56" y="1080" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">routes/auth/mfa.js:42 · routes/auth/mfa.js:43</text><line x1="80" y1="1097" x2="80" y2="1131" stroke="#1f5b43" stroke-width="2"/><path d="M75 1129 L80 1137 L85 1129Z" fill="#1f5b43"/><text x="90" y="1121" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="1137" width="520" height="81" rx="10" fill="#1f5b43" stroke="#1f5b43"/><text x="56" y="1163" font-weight="700" fill="#ffffff">303 trang đang mở; dùng recovery code thì về hồ sơ</text><text x="56" y="1182" fill="#ffffff">Set-Cookie: sid mới · HttpOnly; SameSite=Lax; Path=/</text><text x="56" y="1201" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#d6e7de">routes/auth/mfa.js:63</text>
<text x="40" y="1260" font-size="12" fill="#5f5f5a">Vẽ nháp từ mã nguồn Bài 1 ngày 09/11/2026 · file:dòng trỏ vào source-code/src/ · DB = bảng trong PostgreSQL · nhóm duyệt trước khi dùng.</text>
</svg>