<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1485" width="1100" height="1485" font-family="'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14">
<title>Phân quyền: bốn cổng và câu ghi có điều kiện</title>
<rect width="1100" height="1485" fill="#f7f6f3"/>
<text x="40" y="50" font-size="24" font-weight="700" fill="#1d1d1b">Phân quyền: bốn cổng và câu ghi có điều kiện</text>
<text x="40" y="78" fill="#5f5f5a">PATCH /admin/dishes/:id · danh tính → role → tải món → thuộc tính; không tin chefId, status, role gửi từ trình duyệt</text>
<text x="80" y="104" font-size="12" font-weight="700" fill="#1f5b43" letter-spacing=".04em">LUỒNG CHÍNH (thứ tự trong code)</text>
<text x="650" y="104" font-size="12" font-weight="700" fill="#a8281d" letter-spacing=".04em">DỪNG Ở ĐÂY — không làm các bước bên dưới</text>
<rect x="40" y="112" width="520" height="81" rx="10" fill="#eef0f3" stroke="#d9d6cf"/><text x="56" y="138" font-weight="700" fill="#1d1d1b">Form sửa món, hoặc request gửi thẳng</text><text x="56" y="157" fill="#5f5f5a">POST /admin/dishes/:id?_method=PATCH · Cookie: access, refresh, csrf · _csrf</text><text x="56" y="176" fill="#5f5f5a">Mọi route /admin/* cùng thứ tự, kể cả GET mở form</text><line x1="80" y1="193" x2="80" y2="227" stroke="#1f5b43" stroke-width="2"/><path d="M75 225 L80 233 L85 225Z" fill="#1f5b43"/><text x="90" y="217" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="233" width="520" height="119" rx="10" fill="#ffffff" stroke="#d9d6cf"/><rect x="40" y="233" width="5" height="119" rx="2" fill="#1f5b43"/><text x="56" y="259" font-weight="700" fill="#1d1d1b">Cổng 1, danh tính: JWT access đã verify (hết hạn thì tự refresh)</text><text x="56" y="278" fill="#5f5f5a">loadUser lấy sub từ access, đọc user từ DB (sơ đồ 4)</text><text x="56" y="297" fill="#5f5f5a">(status active, tv khớp tokenVersion, role, chefId mới nhất)</text><text x="56" y="316" fill="#5f5f5a">Chờ MFA chỉ có challenge, không có access nên bị từ chối ở đây</text><text x="56" y="335" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">app.js:74 · DB users, refresh_tokens</text><rect x="650" y="233" width="410" height="81" rx="10" fill="#fbecea" stroke="#efc2bd"/><text x="666" y="259" font-weight="700" fill="#a8281d">303 /login</text><text x="666" y="278" fill="#a8281d">Dữ liệu không đổi.</text><text x="666" y="297" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">auth/require-login.js</text><line x1="560" y1="259" x2="644" y2="259" stroke="#a8281d" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M642 254 L650 259 L642 264Z" fill="#a8281d"/><text x="605" y="252" font-size="12" text-anchor="middle" fill="#a8281d" font-weight="600">không có</text><line x1="80" y1="352" x2="80" y2="386" stroke="#1f5b43" stroke-width="2"/><path d="M75 384 L80 392 L85 384Z" fill="#1f5b43"/><text x="90" y="376" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="392" width="520" height="81" rx="10" fill="#ffffff" stroke="#d9d6cf"/><rect x="40" y="392" width="5" height="81" rx="2" fill="#1f5b43"/><text x="56" y="418" font-weight="700" fill="#1d1d1b">CSRF rồi method-override</text><text x="56" y="437" fill="#5f5f5a">_csrf trùng cookie csrf (double-submit), Origin là site này</text><text x="56" y="456" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">auth/csrf.js:37</text><rect x="650" y="392" width="410" height="81" rx="10" fill="#fbecea" stroke="#efc2bd"/><text x="666" y="418" font-weight="700" fill="#a8281d">403 Yêu cầu bị từ chối</text><text x="666" y="437" fill="#a8281d">Không đọc form, không ghi gì.</text><text x="666" y="456" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">auth/csrf.js</text><line x1="560" y1="418" x2="644" y2="418" stroke="#a8281d" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M642 413 L650 418 L642 423Z" fill="#a8281d"/><text x="605" y="411" font-size="12" text-anchor="middle" fill="#a8281d" font-weight="600">sai / thiếu</text><line x1="80" y1="473" x2="80" y2="507" stroke="#1f5b43" stroke-width="2"/><path d="M75 505 L80 513 L85 505Z" fill="#1f5b43"/><text x="90" y="497" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="513" width="520" height="100" rx="10" fill="#ffffff" stroke="#d9d6cf"/><rect x="40" y="513" width="5" height="100" rx="2" fill="#1f5b43"/><text x="56" y="539" font-weight="700" fill="#1d1d1b">Cổng 2, RBAC: requirePermission("dish:update")</text><text x="56" y="558" fill="#5f5f5a">can(user, action) tra bảng quyền theo role đọc từ DB</text><text x="56" y="577" fill="#5f5f5a">Gắn từng route, không gộp vào requireLogin</text><text x="56" y="596" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">routes/admin/dishes.js:375</text><rect x="650" y="513" width="410" height="81" rx="10" fill="#fbecea" stroke="#efc2bd"/><text x="666" y="539" font-weight="700" fill="#a8281d">403 Không đủ quyền</text><text x="666" y="558" fill="#a8281d">Viewer sửa; Editor xoá.</text><text x="666" y="577" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">auth/require-permission.js:16</text><line x1="560" y1="539" x2="644" y2="539" stroke="#a8281d" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M642 534 L650 539 L642 544Z" fill="#a8281d"/><text x="605" y="532" font-size="12" text-anchor="middle" fill="#a8281d" font-weight="600">thiếu role</text><line x1="80" y1="613" x2="80" y2="647" stroke="#1f5b43" stroke-width="2"/><path d="M75 645 L80 653 L85 645Z" fill="#1f5b43"/><text x="90" y="637" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="653" width="520" height="81" rx="10" fill="#ffffff" stroke="#d9d6cf"/><rect x="40" y="653" width="5" height="81" rx="2" fill="#1f5b43"/><text x="56" y="679" font-weight="700" fill="#1d1d1b">Cổng 3: tải món từ DATABASE</text><text x="56" y="698" fill="#5f5f5a">Đọc chefId, status của bản ghi, không đọc từ form</text><text x="56" y="717" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">routes/admin/dishes.js:34 · DB dishes</text><rect x="650" y="653" width="410" height="43" rx="10" fill="#fbecea" stroke="#efc2bd"/><text x="666" y="679" font-weight="700" fill="#a8281d">404 Không tìm thấy món</text><line x1="560" y1="679" x2="644" y2="679" stroke="#a8281d" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M642 674 L650 679 L642 684Z" fill="#a8281d"/><text x="605" y="672" font-size="12" text-anchor="middle" fill="#a8281d" font-weight="600">không có</text><line x1="80" y1="734" x2="80" y2="768" stroke="#1f5b43" stroke-width="2"/><path d="M75 766 L80 774 L85 766Z" fill="#1f5b43"/><text x="90" y="758" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="774" width="520" height="119" rx="10" fill="#ffffff" stroke="#d9d6cf"/><rect x="40" y="774" width="5" height="119" rx="2" fill="#1f5b43"/><text x="56" y="800" font-weight="700" fill="#1d1d1b">Cổng 4, ABAC: canEditDish(user, dish)</text><text x="56" y="819" fill="#5f5f5a">Admin: mọi món</text><text x="56" y="838" fill="#5f5f5a">Editor: user.chefId khác rỗng, trùng dish.chefId,</text><text x="56" y="857" fill="#5f5f5a">và dish.status = draft</text><text x="56" y="876" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">routes/admin/dishes.js:36</text><rect x="650" y="774" width="410" height="62" rx="10" fill="#fbecea" stroke="#efc2bd"/><text x="666" y="800" font-weight="700" fill="#a8281d">403 dù có role</text><text x="666" y="819" fill="#a8281d">Món của đầu bếp khác, hoặc đã xuất bản.</text><line x1="560" y1="800" x2="644" y2="800" stroke="#a8281d" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M642 795 L650 800 L642 805Z" fill="#a8281d"/><text x="605" y="793" font-size="12" text-anchor="middle" fill="#a8281d" font-weight="600">không thoả</text><line x1="80" y1="893" x2="80" y2="927" stroke="#1f5b43" stroke-width="2"/><path d="M75 925 L80 933 L85 925Z" fill="#1f5b43"/><text x="90" y="917" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="933" width="520" height="100" rx="10" fill="#e8f1ec" stroke="#b9d3c5"/><text x="56" y="959" font-weight="700" fill="#1d1d1b">Trường do server đặt: withServerFields</text><text x="56" y="978" fill="#5f5f5a">Editor: bỏ chefId, status trong body, không thêm nhanh đầu bếp</text><text x="56" y="997" fill="#5f5f5a">role, mfa* không bao giờ đọc từ body</text><text x="56" y="1016" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">routes/admin/dishes.js:193</text><line x1="80" y1="1033" x2="80" y2="1067" stroke="#1f5b43" stroke-width="2"/><path d="M75 1065 L80 1073 L85 1065Z" fill="#1f5b43"/><text x="90" y="1057" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="1073" width="520" height="43" rx="10" fill="#ffffff" stroke="#d9d6cf"/><rect x="40" y="1073" width="5" height="43" rx="2" fill="#1f5b43"/><text x="56" y="1099" font-weight="700" fill="#1d1d1b">Kiểm dữ liệu form</text><rect x="650" y="1073" width="410" height="62" rx="10" fill="#fbecea" stroke="#efc2bd"/><text x="666" y="1099" font-weight="700" fill="#a8281d">200 VALIDATION_FAILED</text><text x="666" y="1118" fill="#a8281d">Đánh dấu ô sai, chưa ghi gì.</text><line x1="560" y1="1099" x2="644" y2="1099" stroke="#a8281d" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M642 1094 L650 1099 L642 1104Z" fill="#a8281d"/><text x="605" y="1092" font-size="12" text-anchor="middle" fill="#a8281d" font-weight="600">sai</text><line x1="80" y1="1135" x2="80" y2="1169" stroke="#1f5b43" stroke-width="2"/><path d="M75 1167 L80 1175 L85 1167Z" fill="#1f5b43"/><text x="90" y="1159" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="1175" width="520" height="138" rx="10" fill="#ffffff" stroke="#d9d6cf"/><rect x="40" y="1175" width="5" height="138" rx="2" fill="#1f5b43"/><text x="56" y="1201" font-weight="700" fill="#1d1d1b">Câu ghi ĐẦU TIÊN của transaction có điều kiện</text><text x="56" y="1220" fill="#5f5f5a">updateMany where editableDishWhere(user, id):</text><text x="56" y="1239" fill="#5f5f5a">id, chefId của user, status draft (Admin: chỉ id)</text><text x="56" y="1258" fill="#5f5f5a">Chạy trước khi tạo tag, nguyên liệu mới</text><text x="56" y="1277" fill="#5f5f5a">Quyền đổi sau lúc qua cổng thì không khớp dòng nào</text><text x="56" y="1296" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">routes/admin/dishes.js:300 · policy/permissions.js:27</text><rect x="650" y="1175" width="410" height="81" rx="10" fill="#fbecea" stroke="#efc2bd"/><text x="666" y="1201" font-weight="700" fill="#a8281d">Rollback, 403 hoặc 404</text><text x="666" y="1220" fill="#a8281d">Không có bản ghi thừa, dữ liệu không đổi.</text><text x="666" y="1239" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">routes/admin/dishes.js:45</text><line x1="560" y1="1201" x2="644" y2="1201" stroke="#a8281d" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M642 1196 L650 1201 L642 1206Z" fill="#a8281d"/><text x="605" y="1194" font-size="12" text-anchor="middle" fill="#a8281d" font-weight="600">count = 0</text><line x1="80" y1="1313" x2="80" y2="1347" stroke="#1f5b43" stroke-width="2"/><path d="M75 1345 L80 1353 L85 1345Z" fill="#1f5b43"/><text x="90" y="1337" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="1353" width="520" height="62" rx="10" fill="#1f5b43" stroke="#1f5b43"/><text x="56" y="1379" font-weight="700" fill="#ffffff">303 về danh sách</text><text x="56" y="1398" fill="#ffffff">Tạo tag, nguyên liệu mới, cập nhật bảng nối trong cùng transaction</text>
<text x="40" y="1457" font-size="12" fill="#5f5f5a">Vẽ nháp từ mã nguồn Bài 1, cập nhật 13/11/2026 (JWT access + refresh, plan mục 15) · file:dòng trỏ vào source-code/src/ · DB = bảng trong PostgreSQL · nhóm duyệt trước khi dùng.</text>
</svg>