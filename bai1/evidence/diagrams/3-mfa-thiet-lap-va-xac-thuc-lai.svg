<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1409" width="1100" height="1409" font-family="'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14">
<title>Bật MFA, hiện recovery code một lần, xác thực lại</title>
<rect width="1100" height="1409" fill="#f7f6f3"/>
<text x="40" y="50" font-size="24" font-weight="700" fill="#1d1d1b">Bật MFA, hiện recovery code một lần, xác thực lại</text>
<text x="40" y="78" fill="#5f5f5a">POST tạo secret chờ → GET vẽ QR → POST xác nhận → 303 → GET mã một lần · thay, tắt, tạo lại mã đều xác thực lại</text>
<text x="80" y="104" font-size="12" font-weight="700" fill="#1f5b43" letter-spacing=".04em">LUỒNG CHÍNH (thứ tự trong code)</text>
<text x="650" y="104" font-size="12" font-weight="700" fill="#a8281d" letter-spacing=".04em">DỪNG Ở ĐÂY — không làm các bước bên dưới</text>
<rect x="40" y="112" width="520" height="81" rx="10" fill="#eef0f3" stroke="#d9d6cf"/><text x="56" y="138" font-weight="700" fill="#1d1d1b">POST /admin/profile/mfa/setup</text><text x="56" y="157" fill="#5f5f5a">Qua requireLogin, csrf như mọi route quản trị</text><text x="56" y="176" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">routes/admin/mfa.js:38</text><line x1="80" y1="193" x2="80" y2="227" stroke="#1f5b43" stroke-width="2"/><path d="M75 225 L80 233 L85 225Z" fill="#1f5b43"/><text x="90" y="217" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="233" width="520" height="100" rx="10" fill="#e8f1ec" stroke="#b9d3c5"/><text x="56" y="259" font-weight="700" fill="#1d1d1b">Sinh secret, lưu bản mã vào mfaPendingSecret</text><text x="56" y="278" fill="#5f5f5a">Chỉ khi mfaEnabled = false · chưa có hiệu lực đăng nhập</text><text x="56" y="297" fill="#5f5f5a">GET không tạo secret; đã bật thì đi đường đổi thiết bị</text><text x="56" y="316" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">auth/mfa.js:73 · DB users</text><line x1="80" y1="333" x2="80" y2="367" stroke="#1f5b43" stroke-width="2"/><path d="M75 365 L80 373 L85 365Z" fill="#1f5b43"/><text x="90" y="357" font-size="12" fill="#1f5b43" font-weight="600">303, GET /setup chỉ đọc để vẽ QR</text><rect x="40" y="373" width="520" height="62" rx="10" fill="#eef0f3" stroke="#d9d6cf"/><text x="56" y="399" font-weight="700" fill="#1d1d1b">Người dùng quét QR, POST /setup/confirm với một mã</text><text x="56" y="418" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">routes/admin/mfa.js:45</text><line x1="80" y1="435" x2="80" y2="469" stroke="#1f5b43" stroke-width="2"/><path d="M75 467 L80 475 L85 467Z" fill="#1f5b43"/><text x="90" y="459" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="475" width="520" height="62" rx="10" fill="#ffffff" stroke="#d9d6cf"/><rect x="40" y="475" width="5" height="62" rx="2" fill="#1f5b43"/><text x="56" y="501" font-weight="700" fill="#1d1d1b">Mã khớp secret chờ? (cùng bộ đếm MFA)</text><text x="56" y="520" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">auth/mfa.js:100</text><rect x="650" y="475" width="410" height="62" rx="10" fill="#fbecea" stroke="#efc2bd"/><text x="666" y="501" font-weight="700" fill="#a8281d">200 INVALID_OTP, MFA chưa bật</text><text x="666" y="520" fill="#a8281d">Sai quá ngưỡng: 429.</text><line x1="560" y1="501" x2="644" y2="501" stroke="#a8281d" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M642 496 L650 501 L642 506Z" fill="#a8281d"/><text x="605" y="494" font-size="12" text-anchor="middle" fill="#a8281d" font-weight="600">sai</text><line x1="80" y1="537" x2="80" y2="571" stroke="#1f5b43" stroke-width="2"/><path d="M75 569 L80 577 L85 569Z" fill="#1f5b43"/><text x="90" y="561" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="577" width="520" height="100" rx="10" fill="#e8f1ec" stroke="#b9d3c5"/><text x="56" y="603" font-weight="700" fill="#1d1d1b">Một transaction bật MFA</text><text x="56" y="622" fill="#5f5f5a">mfaSecret ← bản mã, mfaEnabled = true, ghi mfaLastStep</text><text x="56" y="641" fill="#5f5f5a">Sinh 10 recovery code, DB chỉ lưu HMAC-SHA256 kèm pepper</text><text x="56" y="660" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">auth/mfa.js:107 · DB users, recovery_codes</text><line x1="80" y1="677" x2="80" y2="711" stroke="#1f5b43" stroke-width="2"/><path d="M75 709 L80 717 L85 709Z" fill="#1f5b43"/><text x="90" y="701" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="717" width="520" height="81" rx="10" fill="#e8f1ec" stroke="#b9d3c5"/><text x="56" y="743" font-weight="700" fill="#1d1d1b">Giữ mã gốc trong RAM tối đa 60 giây, theo sessionID</text><text x="56" y="762" fill="#5f5f5a">Không ghi DB, session, log (plan 12.11)</text><text x="56" y="781" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">routes/admin/mfa.js:60</text><line x1="80" y1="798" x2="80" y2="832" stroke="#1f5b43" stroke-width="2"/><path d="M75 830 L80 838 L85 830Z" fill="#1f5b43"/><text x="90" y="822" font-size="12" fill="#1f5b43" font-weight="600">303, giữ đúng PRG của Block 5</text><rect x="40" y="838" width="520" height="81" rx="10" fill="#1f5b43" stroke="#1f5b43"/><text x="56" y="864" font-weight="700" fill="#ffffff">GET /codes: đọc là xoá, Reload không hiện lại</text><text x="56" y="883" fill="#ffffff">Không còn mã: về hồ sơ, mời tạo nhóm mới</text><text x="56" y="902" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#d6e7de">routes/admin/mfa.js:66</text><line x1="80" y1="919" x2="80" y2="953" stroke="#1f5b43" stroke-width="2"/><path d="M75 951 L80 959 L85 951Z" fill="#1f5b43"/><text x="90" y="943" font-size="12" fill="#1f5b43" font-weight="600">về sau: đổi thiết bị, tạo lại mã, tắt MFA</text><rect x="40" y="959" width="520" height="81" rx="10" fill="#eef0f3" stroke="#d9d6cf"/><text x="56" y="985" font-weight="700" fill="#1d1d1b">POST /admin/profile/mfa/reauth/:action</text><text x="56" y="1004" fill="#5f5f5a">Chỉ replace, regenerate, disable · phiên đầy đủ vẫn phải nhập</text><text x="56" y="1023" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">routes/admin/mfa.js:91</text><line x1="80" y1="1040" x2="80" y2="1074" stroke="#1f5b43" stroke-width="2"/><path d="M75 1072 L80 1080 L85 1072Z" fill="#1f5b43"/><text x="90" y="1064" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="1080" width="520" height="100" rx="10" fill="#ffffff" stroke="#d9d6cf"/><rect x="40" y="1080" width="5" height="100" rx="2" fill="#1f5b43"/><text x="56" y="1106" font-weight="700" fill="#1d1d1b">Password đúng, rồi một mã TOTP hoặc recovery code</text><text x="56" y="1125" fill="#5f5f5a">So password trước để gõ sai không mất một recovery code</text><text x="56" y="1144" fill="#5f5f5a">Sai tính chung bộ đếm MFA</text><text x="56" y="1163" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">routes/admin/mfa.js:94</text><rect x="650" y="1080" width="410" height="62" rx="10" fill="#fbecea" stroke="#efc2bd"/><text x="666" y="1106" font-weight="700" fill="#a8281d">200 INVALID_OTP</text><text x="666" y="1125" fill="#a8281d">Không đổi gì. Sai quá ngưỡng: 429.</text><line x1="560" y1="1106" x2="644" y2="1106" stroke="#a8281d" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M642 1101 L650 1106 L642 1111Z" fill="#a8281d"/><text x="605" y="1099" font-size="12" text-anchor="middle" fill="#a8281d" font-weight="600">sai</text><line x1="80" y1="1180" x2="80" y2="1214" stroke="#1f5b43" stroke-width="2"/><path d="M75 1212 L80 1220 L85 1212Z" fill="#1f5b43"/><text x="90" y="1204" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="1220" width="520" height="119" rx="10" fill="#1f5b43" stroke="#1f5b43"/><text x="56" y="1246" font-weight="700" fill="#ffffff">Làm đúng một việc đã xác thực</text><text x="56" y="1265" fill="#ffffff">replace → secret chờ mới, chỉ xác nhận được trong 10 phút ở chính phiên này (12/11, plan 14 L2) · regenerate → nhóm mã mới</text><text x="56" y="1284" fill="#ffffff">disable → xoá secret và mã</text><text x="56" y="1303" fill="#ffffff">Reset mật khẩu không đi qua đây, không đổi mfaEnabled</text><text x="56" y="1322" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#d6e7de">routes/admin/mfa.js:102</text>
<text x="40" y="1381" font-size="12" fill="#5f5f5a">Vẽ nháp từ mã nguồn Bài 1 ngày 09/11/2026 · file:dòng trỏ vào source-code/src/ · DB = bảng trong PostgreSQL · nhóm duyệt trước khi dùng.</text>
</svg>