<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1250" width="1100" height="1250" font-family="'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14">
<title>Access token 90 giây + refresh token: server tự refresh</title>
<rect width="1100" height="1250" fill="#f7f6f3"/>
<text x="40" y="50" font-size="24" font-weight="700" fill="#1d1d1b">Access token 90 giây + refresh token: server tự refresh</text>
<text x="40" y="78" fill="#5f5f5a">Mỗi request trang (trừ file tĩnh, /favicon.ico) qua loadUser · access hợp lệ thì dùng luôn; không thì xoay vòng refresh ngay trong request</text>
<text x="80" y="104" font-size="12" font-weight="700" fill="#1f5b43" letter-spacing=".04em">LUỒNG CHÍNH (thứ tự trong code)</text>
<text x="650" y="104" font-size="12" font-weight="700" fill="#a8281d" letter-spacing=".04em">DỪNG Ở ĐÂY — không làm các bước bên dưới</text>
<rect x="40" y="112" width="520" height="81" rx="10" fill="#eef0f3" stroke="#d9d6cf"/><text x="56" y="138" font-weight="700" fill="#1d1d1b">Request trang: Cookie access (JWT), refresh (chuỗi ngẫu nhiên), csrf</text><text x="56" y="157" fill="#5f5f5a">File tĩnh và /favicon.ico trả trước loadUser: không tạo request refresh song song</text><text x="56" y="176" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">app.js:60 · auth/load-user.js:46</text><line x1="80" y1="193" x2="80" y2="227" stroke="#1f5b43" stroke-width="2"/><path d="M75 225 L80 233 L85 225Z" fill="#1f5b43"/><text x="90" y="217" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="233" width="520" height="100" rx="10" fill="#ffffff" stroke="#d9d6cf"/><rect x="40" y="233" width="5" height="100" rx="2" fill="#1f5b43"/><text x="56" y="259" font-weight="700" fill="#1d1d1b">Access hợp lệ? HS256, iss/aud nhahang-bai1, chưa quá exp</text><text x="56" y="278" fill="#5f5f5a">Tải user theo sub từ DB: status active, tv khớp tokenVersion</text><text x="56" y="297" fill="#5f5f5a">Role, chefId lấy từ DB, không có trong token</text><text x="56" y="316" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">auth/jwt.js:26 · auth/load-user.js:52</text><rect x="650" y="233" width="410" height="81" rx="10" fill="#fdf3dc" stroke="#ecd9a8"/><text x="666" y="259" font-weight="700" fill="#8a5a00">Dùng luôn, không đụng refresh token</text><text x="666" y="278" fill="#5f5f5a">Đã cấp thì còn dùng được tới exp (≤ 90 giây),</text><text x="666" y="297" fill="#5f5f5a">kể cả sau đăng xuất: rủi ro còn lại đã công bố.</text><line x1="560" y1="259" x2="644" y2="259" stroke="#a8281d" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M642 254 L650 259 L642 264Z" fill="#a8281d"/><text x="605" y="252" font-size="12" text-anchor="middle" fill="#a8281d" font-weight="600">hợp lệ</text><line x1="80" y1="333" x2="80" y2="367" stroke="#1f5b43" stroke-width="2"/><path d="M75 365 L80 373 L85 365Z" fill="#1f5b43"/><text x="90" y="357" font-size="12" fill="#1f5b43" font-weight="600">không có / hết hạn / sai</text><rect x="40" y="373" width="520" height="62" rx="10" fill="#ffffff" stroke="#d9d6cf"/><rect x="40" y="373" width="5" height="62" rx="2" fill="#1f5b43"/><text x="56" y="399" font-weight="700" fill="#1d1d1b">Có cookie refresh, tra được SHA-256 trong refresh_tokens?</text><text x="56" y="418" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">auth/refresh.js:55 · DB refresh_tokens</text><rect x="650" y="373" width="410" height="81" rx="10" fill="#fbecea" stroke="#efc2bd"/><text x="666" y="399" font-weight="700" fill="#a8281d">Ẩn danh, xoá cookie</text><text x="666" y="418" fill="#a8281d">/admin/* → 303 /login; trang công khai hiện như khách.</text><text x="666" y="437" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">auth/load-user.js:65</text><line x1="560" y1="399" x2="644" y2="399" stroke="#a8281d" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M642 394 L650 399 L642 404Z" fill="#a8281d"/><text x="605" y="392" font-size="12" text-anchor="middle" fill="#a8281d" font-weight="600">không</text><line x1="80" y1="454" x2="80" y2="488" stroke="#1f5b43" stroke-width="2"/><path d="M75 486 L80 494 L85 486Z" fill="#1f5b43"/><text x="90" y="478" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="494" width="520" height="81" rx="10" fill="#ffffff" stroke="#d9d6cf"/><rect x="40" y="494" width="5" height="81" rx="2" fill="#1f5b43"/><text x="56" y="520" font-weight="700" fill="#1d1d1b">Token đã dùng (usedAt) xuất hiện lại?</text><text x="56" y="539" fill="#5f5f5a">Có hai bên cùng giữ token, server không biết ai là chủ thật</text><text x="56" y="558" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">auth/refresh.js:61</text><rect x="650" y="494" width="410" height="81" rx="10" fill="#fbecea" stroke="#efc2bd"/><text x="666" y="520" font-weight="700" fill="#a8281d">Thu hồi CẢ family, 303 /login</text><text x="666" y="539" fill="#a8281d">Cả chủ lẫn kẻ gian phải đăng nhập lại (15.2 b).</text><text x="666" y="558" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">auth/refresh.js:62</text><line x1="560" y1="520" x2="644" y2="520" stroke="#a8281d" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M642 515 L650 520 L642 525Z" fill="#a8281d"/><text x="605" y="513" font-size="12" text-anchor="middle" fill="#a8281d" font-weight="600">có</text><line x1="80" y1="575" x2="80" y2="609" stroke="#1f5b43" stroke-width="2"/><path d="M75 607 L80 615 L85 607Z" fill="#1f5b43"/><text x="90" y="599" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="615" width="520" height="100" rx="10" fill="#ffffff" stroke="#d9d6cf"/><rect x="40" y="615" width="5" height="100" rx="2" fill="#1f5b43"/><text x="56" y="641" font-weight="700" fill="#1d1d1b">Chưa thu hồi, chưa hết hạn?</text><text x="56" y="660" fill="#5f5f5a">expiresAt = min(lúc cấp + IDLE, familyExpiresAt)</text><text x="56" y="679" fill="#5f5f5a">Thu hồi khi: đăng xuất, đổi / đặt lại mật khẩu, phát hiện dùng lại</text><text x="56" y="698" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">auth/refresh.js:65</text><rect x="650" y="615" width="410" height="43" rx="10" fill="#fbecea" stroke="#efc2bd"/><text x="666" y="641" font-weight="700" fill="#a8281d">Ẩn danh, xoá cookie</text><line x1="560" y1="641" x2="644" y2="641" stroke="#a8281d" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M642 636 L650 641 L642 646Z" fill="#a8281d"/><text x="605" y="634" font-size="12" text-anchor="middle" fill="#a8281d" font-weight="600">không</text><line x1="80" y1="715" x2="80" y2="749" stroke="#1f5b43" stroke-width="2"/><path d="M75 747 L80 755 L85 747Z" fill="#1f5b43"/><text x="90" y="739" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="755" width="520" height="62" rx="10" fill="#ffffff" stroke="#d9d6cf"/><rect x="40" y="755" width="5" height="62" rx="2" fill="#1f5b43"/><text x="56" y="781" font-weight="700" fill="#1d1d1b">User còn active, tokenVersion khớp tv của dòng?</text><text x="56" y="800" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">auth/refresh.js:69</text><rect x="650" y="755" width="410" height="62" rx="10" fill="#fbecea" stroke="#efc2bd"/><text x="666" y="781" font-weight="700" fill="#a8281d">Thu hồi family, ẩn danh</text><text x="666" y="800" fill="#a8281d">Mật khẩu đã đổi sau khi cấp token.</text><line x1="560" y1="781" x2="644" y2="781" stroke="#a8281d" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M642 776 L650 781 L642 786Z" fill="#a8281d"/><text x="605" y="774" font-size="12" text-anchor="middle" fill="#a8281d" font-weight="600">không</text><line x1="80" y1="817" x2="80" y2="851" stroke="#1f5b43" stroke-width="2"/><path d="M75 849 L80 857 L85 849Z" fill="#1f5b43"/><text x="90" y="841" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="857" width="520" height="81" rx="10" fill="#ffffff" stroke="#d9d6cf"/><rect x="40" y="857" width="5" height="81" rx="2" fill="#1f5b43"/><text x="56" y="883" font-weight="700" fill="#1d1d1b">Đánh dấu usedAt bằng câu ghi có điều kiện (transaction)</text><text x="56" y="902" fill="#5f5f5a">Hai request cùng token đồng thời: chỉ một request count = 1</text><text x="56" y="921" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">auth/refresh.js:77</text><rect x="650" y="857" width="410" height="43" rx="10" fill="#fbecea" stroke="#efc2bd"/><text x="666" y="883" font-weight="700" fill="#a8281d">Coi như dùng lại: thu hồi family</text><line x1="560" y1="883" x2="644" y2="883" stroke="#a8281d" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M642 878 L650 883 L642 888Z" fill="#a8281d"/><text x="605" y="876" font-size="12" text-anchor="middle" fill="#a8281d" font-weight="600">count = 0</text><line x1="80" y1="938" x2="80" y2="972" stroke="#1f5b43" stroke-width="2"/><path d="M75 970 L80 978 L85 970Z" fill="#1f5b43"/><text x="90" y="962" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="978" width="520" height="81" rx="10" fill="#e8f1ec" stroke="#b9d3c5"/><text x="56" y="1004" font-weight="700" fill="#1d1d1b">Cấp refresh mới CÙNG family, ký access mới 90 giây</text><text x="56" y="1023" fill="#5f5f5a">Hạn mới không vượt trần của family (mặc định 120 / 720 phút)</text><text x="56" y="1042" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">auth/refresh.js:79 · auth/refresh.js:27</text><line x1="80" y1="1059" x2="80" y2="1093" stroke="#1f5b43" stroke-width="2"/><path d="M75 1091 L80 1099 L85 1091Z" fill="#1f5b43"/><text x="90" y="1083" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="1099" width="520" height="81" rx="10" fill="#1f5b43" stroke="#1f5b43"/><text x="56" y="1125" font-weight="700" fill="#ffffff">Set-Cookie access + refresh, xử lý tiếp CHÍNH request đó</text><text x="56" y="1144" fill="#ffffff">Không chuyển hướng: form đang gửi không mất dữ liệu</text><text x="56" y="1163" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#d6e7de">auth/load-user.js:60</text>
<text x="40" y="1222" font-size="12" fill="#5f5f5a">Vẽ nháp từ mã nguồn Bài 1, cập nhật 13/11/2026 (JWT access + refresh, plan mục 15) · file:dòng trỏ vào source-code/src/ · DB = bảng trong PostgreSQL · nhóm duyệt trước khi dùng.</text>
</svg>